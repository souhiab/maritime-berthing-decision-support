    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(73.728 341.438811)">Compare with fixed path</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #326a9c" x="344.448" y="261.430594" transform="rotate(-0 344.448 261.430594)">02 / LOOK AHEAD</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #152a3b" transform="translate(344.448 287.117813)">Predict action</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #152a3b" transform="translate(344.448 305.454203)">consequences</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(344.448 330.690328)">Roll each action through</text>
