   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526574" x="1094.4" y="38.126438" transform="rotate(-0 1094.4 38.126438)">01 / OVERVIEW</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="57.6" y="91.155469" transform="rotate(-0 57.6 91.155469)">Keep an approach trajectory on course</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="57.6" y="131.230125" transform="rotate(-0 57.6 131.230125)">One fixed berth, a planned path and changing wind/current; recommend an abstract correction.</text>
