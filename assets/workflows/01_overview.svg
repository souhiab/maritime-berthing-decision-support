    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(344.448 358.718811)">2 seconds per step</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #326a9c" x="615.168" y="261.430594" transform="rotate(-0 615.168 261.430594)">03 / RANK</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="615.168" y="286.130016" transform="rotate(-0 615.168 286.130016)">Recommend correction</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(615.168 313.866234)">Balance path error,</text>
