   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #326a9c" x="73.728" y="261.430594" transform="rotate(-0 73.728 261.430594)">01 / OBSERVE</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="73.728" y="286.965844" transform="rotate(-0 73.728 286.965844)">State + environment</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(73.728 313.410328)">Position, heading, speed</text>
