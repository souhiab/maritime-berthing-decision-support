    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #e0eaee" transform="translate(885.888 340.08708)">Repeat until approach zone</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="57.6" y="527.898047" transform="rotate(-0 57.6 527.898047)">Goal: tighter tracking under disturbances. Compare maintain-only, reactive and predictive policies.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="77.184" y="601.969266" transform="rotate(-0 77.184 601.969266)">Fixed berth</text>
