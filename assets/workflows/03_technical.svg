   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="57.6" y="91.155469" transform="rotate(-0 57.6 91.155469)">Rank six actions through a 12-second look-ahead</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="57.6" y="131.230125" transform="rotate(-0 57.6 131.230125)">score_action() uses the current environment held fixed across six 2-second simulator steps.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #326a9c" x="73.728" y="215.350594" transform="rotate(-0 73.728 215.350594)">INPUT CONTRACT</text>
   </g>
